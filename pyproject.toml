[project]
name = "stretch4_mujoco"
# Versioning follow CalVer (YYYY.MM.DD) for PEP 440 compliance
version = "2026.05.07"
description = "A Stretch 4 simulation in MuJoCo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "hello-robot-stretch-urdf>=0.1.0",
    "hello-robot-stretch4-urdf>=2026.8.21",
    "inputs>=0.5",
    "matplotlib>=3.10.1",
    "mujoco~=3.5.0",
    "numpy==2.2.5",
    "opencv-python",
    # Used by models/stretch_4/head_texture.py to unwrap and paint the head mesh.
    "pillow>=10.0",
    "trimesh>=4.0",
    "pynput>=1.8.1",
    "rerun-sdk>=0.23.1",
    "yourdfpy",
    "urdf2mjcf>=0.2.39",
    "pygame>=2.5.0",
    # pinocchio, the package used by flying gripper to resolve IK does not have pypi wheels for Windows
    "hello-robot-stretch4-flying-gripper>=2026.7.2; sys_platform != 'win32'",
]
authors = [
    {name = "Hello Robot Inc.", email = "support@hello-robot.com"},
]
license = { file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["third_party*", "tests*"]

[project.urls]
Source = "https://github.com/hello-robot/stretch4_mujoco"
Tracker = "https://github.com/hello-robot/stretch4_mujoco/issues"

[tool.black]
line-length = 100

[tool.uv.sources]
molmo-spaces = { git = "https://github.com/allenai/molmospaces.git" }

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "flake8",
    "black",
    "mypy",
]
jupyter = [
    "ipykernel",
    "ipython",
]
# Linux-only: MolmoSpaces pulls `eva-decord`, which ships no macOS wheel for
# Python 3.12 and no source distribution.
molmo = [
    "molmo-spaces[mujoco]",
]
# Linux-only: the real robot's driver stack needs `evdev`, which is sdist-only
# and builds against Linux input headers.
digital-twin = [
    "hello-robot-stretch4-body",
]
