[project]
name = "stretch4_mujoco"
# Versioning follow CalVer (YYYY.MM.DD) for PEP 440 compliance
version = "2026.05.07"
description = "A Stretch 4 simulation in MuJoCo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "hello-robot-stretch-urdf>=0.1.0",
    "hello-robot-stretch4-urdf>=2026.5.6",
    "matplotlib>=3.10.1",
    "mujoco~=3.5.0",
    "numpy==2.2.5",
    "opencv-python",
    "pynput>=1.8.1",
    "rerun-sdk>=0.23.1",
    "yourdfpy",
    "urdf2mjcf>=0.2.39",
    "pin>=4.1.0",
    "coal>=3.0.3",
    "evdev>=1.9.3",
    "hello-robot-stretch4-flying-gripper>=2026.7.2",
]
authors = [
    {name = "Hello Robot Inc.", email = "support@hello-robot.com"},
]
license = { file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["third_party*", "tests*"]

[project.urls]
Source = "https://github.com/hello-robot/stretch4_mujoco"
Tracker = "https://github.com/hello-robot/stretch4_mujoco/issues"

[tool.black]
line-length = 100

[tool.uv.sources]
molmo-spaces = { git = "https://github.com/allenai/molmospaces.git" }

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "flake8",
    "black",
    "mypy",
]
jupyter = [
    "ipykernel",
    "ipython",
]
molmo = [
    "molmo-spaces[mujoco]",
]
