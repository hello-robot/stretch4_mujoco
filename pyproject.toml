[project]
name = "stretch4_mujoco"
# Versioning follow CalVer (YYYY.MM.DD) for PEP 440 compliance
version = "2026.05.07"
description = "A Stretch 4 simulation in MuJoCo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "hello-robot-stretch-urdf>=0.1.0",
    "hello-robot-stretch4-urdf>=2026.5.6",
    "matplotlib>=3.10.1",
    "mujoco~=3.5.0",
    "numpy==2.2.6",
    "opencv-python",
    "pynput>=1.8.1",
    "rerun-sdk>=0.23.1",
    "yourdfpy",
    "urdf2mjcf>=0.2.39",
    "pin>=4.1.0",
    "coal>=3.0.3",
    "pygame>=2.5.0",
    "hello-robot-stretch4-flying-gripper>=2026.7.2",
]
authors = [
    {name = "Hello Robot Inc.", email = "support@hello-robot.com"},
]
license = { file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["third_party*", "tests*"]

[project.urls]
Source = "https://github.com/hello-robot/stretch4_mujoco"
Tracker = "https://github.com/hello-robot/stretch4_mujoco/issues"

[tool.black]
line-length = 100

[tool.uv.sources]
molmo-spaces = { git = "https://github.com/allenai/molmospaces.git" }
# Blackwell GPUs (sm_120, e.g. RTX 5090) need a CUDA 12.8 build of torch; the default
# PyPI wheel has no kernels for them.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "flake8",
    "black",
    "mypy",
]
jupyter = [
    "ipykernel",
    "ipython",
]
molmo = [
    "molmo-spaces[mujoco]",
]
digital-twin = [
    "hello-robot-stretch4-body",
]
# examples/vla/molmobot_droid: MolmoBot-DROID retargeted onto Stretch 4. MolmoBot's own code
# is cloned at runtime (see examples/vla/molmobot_droid/checkpoint.py) because it pins
# Python 3.11; these are the packages its inference path imports.
molmobot-droid = [
    "molmo-spaces[mujoco]",
    "hello-robot-stretch4-kinematics>=2026.9.15",
    "hello-robot-stretch4-body",
    "pyzmq",
    "imageio[ffmpeg]",
    "huggingface_hub",
    "torch>=2.7.1",
    "torchvision",
    "accelerate",
    "av",
    "cached_path",
    "cached_property",
    "einops",
    "einops-exts",
    "fiddle",
    "hydra-core",
    "rich",
    "sentencepiece",
    "tokenizers",
    "torchmetrics",
    "transformers~=5.4.0",
]
