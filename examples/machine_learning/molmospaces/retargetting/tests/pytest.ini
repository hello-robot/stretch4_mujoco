# Import these tests by file path rather than by package name.
#
# There is an `__init__.py` at the root of this checkout, so pytest's default
# `prepend` import mode treats every directory from here up to it as one package
# and imports each ancestor `__init__.py` under a `stretch4_mujoco.` prefix --
# `stretch4_mujoco.examples`, which does not exist, because `stretch4_mujoco` is
# the package *inside* the checkout. Collection then fails before any test runs.
# `conftest.py` in this directory explains the other half of that layout problem.
#
# `importlib` mode imports the test module from its path without inventing a
# package name for it, which sidesteps the whole question. It lives in a
# directory-local ini rather than in `pyproject.toml` so that it applies when
# these tests are run -- `pytest <this directory>`, which is how the module
# docstring says to -- and changes nothing about how `tests/` at the root of the
# repository is collected.
[pytest]
addopts = --import-mode=importlib
